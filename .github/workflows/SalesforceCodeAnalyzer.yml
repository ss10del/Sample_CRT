# Description: Script for PR Validation
name: Automated Salesforce Code Analyzer
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Git Log and Extract Files
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.ref }}"
          echo "Base branch: $BASE"

          git fetch origin "$BASE" || echo "Fetch failed, continuing..."

          CHANGED="$(git diff --name-only --diff-filter=d origin/$BASE...HEAD || true)"

          FILTERED="$(printf '%s\n' "${CHANGED}" | grep -E '(^|/)(classes/.*\.cls$|triggers/.*\.trigger$|aura/|lwc/)' || true)"

          FILES="$(printf '%s\n' "${FILTERED}" | tr '\n' ',' | sed 's/,$//')"

          echo "FILES=$FILES" >> "$GITHUB_ENV"
          echo "Files found: $FILES"

          if [ -z "$FILES" ]; then
            echo "SKIP_ANALYZER=true" >> "$GITHUB_ENV"
            echo "No relevant changes detected; skipping analyzer."
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Update Salesforce CLI and Plugins
        run: |
          sf update
          sf plugins update

      - name: Install SGD
        run: |
          echo y | sf plugins install sfdx-git-delta
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Run Salesforce Code Analyzer
        if: env.SKIP_ANALYZER != 'true'
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --target "${{ env.FILES }}" --rule-selector all --output-file sf-scanner-report.csv

      - name: Process Violations and Generate Excel
        id: violation_check
        if: env.SKIP_ANALYZER != 'true'
        run: |
          set -e

          sudo apt-get update && sudo apt-get install -y jq python3-pip
          pip3 install pandas openpyxl

          python3 << 'EOF'
          import pandas as pd
          import json
          import sys
          import os

          import glob

          files = glob.glob('**/sf-scanner-report.csv', recursive=True)

          if not files:
              print("No analyzer report found. Creating empty report.")
    
              import pandas as pd
              with pd.ExcelWriter("Violation_Report.xlsx") as writer:
                  pd.DataFrame().to_excel(writer, sheet_name="All", index=False)
    
              sys.exit(0)

          csv_file = files[0]
          print(f"Using report: {csv_file}")

          df = pd.read_csv(csv_file, engine='python')

          df.columns = ["Rule", "Engine", "Severity", "Tags", "File", "Line", "Message"]

          df["Severity"] = pd.to_numeric(df["Severity"], errors="coerce")

          df_filtered = df[df["Severity"].isin([1, 2])]

          with open('.github/code-analyzer-config/false-positives.json') as f:
              config = json.load(f)

          def is_false_positive(row):
              for entry in config.get("entries", []):
                  rule_match = row["Rule"] == entry.get("rule")
                  file_match = True if "file" not in entry else entry["file"] in str(row["File"])
                  msg_match = True if "messageContains" not in entry else entry["messageContains"] in str(row["Message"])

                  if rule_match and file_match and msg_match:
                      return True
              return False

          if not df_filtered.empty:
              df_filtered["IsFalsePositive"] = df_filtered.apply(is_false_positive, axis=1)
          else:
              df_filtered["IsFalsePositive"] = False

          real_violations = df_filtered[df_filtered["IsFalsePositive"] == False]
          false_violations = df_filtered[df_filtered["IsFalsePositive"] == True]

          with pd.ExcelWriter("Violation_Report.xlsx") as writer:
              df.to_excel(writer, sheet_name="All", index=False)
              df_filtered.to_excel(writer, sheet_name="High_Critical", index=False)
              real_violations.to_excel(writer, sheet_name="Real_Violations", index=False)
              false_violations.to_excel(writer, sheet_name="False_Positives", index=False)

          print("Excel report generated.")

          if len(real_violations) > 0:
            print(f"❌ Found {len(real_violations)} real High/Critical violations.")

            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("fail_on_violation=true\n")

            sys.exit(1)
          else:
            print("✅ Only false positives or no violations found.")

            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("fail_on_violation=false\n")

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Salesforce-Code-Analyzer-Report
          path: Violation_Report.xlsx

      - name: Check PR Approver for Bypass
        if: steps.violation_check.outputs.fail_on_violation == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.USER_PAT }}
          script: |
            const fs = require('fs');

            const bypassConfig = JSON.parse(
              fs.readFileSync('.github/code-analyzer-config/bypass-users.json', 'utf8')
            );

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const approvers = reviews.data
              .filter(r => r.state === "APPROVED")
              .map(r => r.user.login);

            console.log("Approvers:", approvers);

            const allowedUsers = bypassConfig.users || [];

            const isBypassed = approvers.some(a => allowedUsers.includes(a));

            if (!isBypassed) {
              core.setFailed("❌ PR blocked: High/Critical violations found and no authorized bypass.");
            } else {
              console.log("✅ Bypass granted by authorized user.");
            }
            
      - name: Enforce Approval Rules
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.USER_PAT }}
          script: |
            const fs = require('fs');

            const bypassConfig = JSON.parse(
              fs.readFileSync('.github/code-analyzer-config/bypass-users.json', 'utf8')
            );

            const allowedUsers = bypassConfig.users || [];

            const prNumber = context.payload.pull_request.number;

            const failOnViolation = "${{ steps.violation_check.outputs.fail_on_violation }}" === "true";

            // ✅ If no violations → do nothing
            if (!failOnViolation) {
              console.log("✅ No violations → anyone can approve.");
              return;
            }

            console.log("❌ Violations exist → enforcing approval restriction.");

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            for (const review of reviews) {
              if (review.state === "APPROVED") {
                const user = review.user.login;

                if (!allowedUsers.includes(user)) {
                  console.log(`❌ Removing approval from ${user}`);

                  await github.rest.pulls.dismissReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    review_id: review.id,
                    message: "❌ Approval not allowed when violations exist. Only bypass users can approve."
                  });
                } else {
                  console.log(`✅ Valid approval from bypass user: ${user}`);
                }
              }
            }
