# Description: Script for PR Validation
name: Automated Salesforce Code Analayzer

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 200

      - name: Git Log and Extract Files (classes/triggers/aura/lwc only)
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          # Extract changed files between the PR branch and target branch
          CHANGED="$(git diff --name-only --diff-filter=d origin/main...HEAD)"

          # Keep only:
          # - any .cls under a /classes/ folder
          # - any .trigger under a /triggers/ folder
          # - anything under a /aura/ folder
          # - anything under a /lwc/ folder
          FILTERED="$(printf '%s\n' "${CHANGED}" | grep -E '(^|/)(classes/.*\.cls$|triggers/.*\.trigger$|aura/|lwc/)' || true)"

          # Comma-separated for --target
          FILES="$(printf '%s\n' "${FILTERED}" | tr '\n' ',' | sed 's/,$//')"

          echo "FILES=$FILES" >> "$GITHUB_ENV"
          echo "Files found: $FILES"

          if [ -z "$FILES" ]; then
            echo "SKIP_ANALYZER=true" >> "$GITHUB_ENV"
            echo "No classes/triggers/aura/lwc changes detected; skipping analyzer."
          fi

      - name: 'Set up JDK 11'
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 'Install Salesforce CLI'
        run: |
          npm install @salesforce/cli --global

      - name: 'Update Salesforce CLI and Plugins'
        run: |
          sf update
          sf plugins update

      - name: Install SGD
        run: |
          echo y | sf plugins install sfdx-git-delta
          pwd
          git config --global --add safe.directory /home/runner/work/v1_cares_salesforce/v1_cares_salesforce

      - name: Print Files
        shell: bash
        run: |
          echo "Files found: $FILES"

      - name: Run Salesforce Code Analyzer
        if: env.SKIP_ANALYZER != 'true'
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --target "${{ env.FILES }}" --rule-selector all --output-file sf-scanner-report.csv

      - name: Install jq
        run: sudo apt-get install jq

      - name: Parse Analyzer Report and Enforce Rules
        if: env.SKIP_ANALYZER != 'true'
        id: enforce
        run: |
          set -e

          echo "Reading analyzer report..."

          if [ ! -f sf-scanner-report.csv ]; then
            echo "No report found. Passing."
            exit 0
          fi

          # Extract Severity 1 & 2 (Critical & High)
          awk -F',' 'NR>1 && ($3=="1" || $3=="2") {print}' sf-scanner-report.csv > violations.csv || true

          if [ ! -s violations.csv ]; then
            echo "No High/Critical violations."
            exit 0
          fi

          echo "High/Critical violations detected:"
          cat violations.csv

          # Install jq if not present
          sudo apt-get update && sudo apt-get install -y jq

          # Load false positives
          FALSE_RULES=$(jq -r '.rules[]?' .github/code-analyzer-config/false-positives.json)
          FALSE_FILES=$(jq -r '.files[]?' .github/code-analyzer-config/false-positives.json)

          VALID_VIOLATIONS=0

          while IFS= read -r line; do
            RULE=$(echo "$line" | awk -F',' '{print $1}')
            FILE=$(echo "$line" | awk -F',' '{print $5}')

            IGNORE=false

            # Match rule
            for r in $FALSE_RULES; do
              if [ "$RULE" == "$r" ]; then
                IGNORE=true
              fi
            done

            # Match file
            for f in $FALSE_FILES; do
              if [[ "$FILE" == *"$f"* ]]; then
                IGNORE=true
              fi
            done

            if [ "$IGNORE" = false ]; then
              VALID_VIOLATIONS=1
              echo "❌ Blocking violation: $line"
            else
              echo "⚠️ Ignored false positive: $line"
            fi

          done < violations.csv

          if [ "$VALID_VIOLATIONS" -eq 1 ]; then
            echo "BLOCK_PR=true" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ Only false positives found. Passing."
          fi

      - name: Check PR Approver for Bypass
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const bypassConfig = JSON.parse(
              fs.readFileSync('.github/code-analyzer-config/bypass-users.json', 'utf8')
            );

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const approvers = reviews.data
              .filter(r => r.state === "APPROVED")
              .map(r => r.user.login);

            console.log("Approvers:", approvers);

            const allowedUsers = bypassConfig.users || [];

            const isBypassed = approvers.some(a => allowedUsers.includes(a));

            if (!isBypassed) {
              core.setFailed("❌ PR blocked: High/Critical violations found and no authorized bypass.");
            } else {
              console.log("✅ Bypass granted by authorized user.");
            }
