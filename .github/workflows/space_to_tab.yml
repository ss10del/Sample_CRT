name: Space To Tab Fixer (ApexClass)

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "classes/*.cls"

permissions:
  contents: write

jobs:
  fix-indent:
    # Avoid infinite loop when the changes are pushed via autofix commit
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'feature/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 500
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Space → Tab Fixer Script
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/Space_to_tab_Autofix.py
